; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

[esp32-base]
; shared esp32 base config
; use pioarduino/platform-espressif32, since platformio itself sucks
; this version is Arduino Release v3.3.9 based on ESP-IDF v5.5.4
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    stevemarple/MicroNMEA @ 2.0.6
build_flags =
    -Isrc
    -DUBLOX_GNSS_RX_PIN=13
    -DUBLOX_GNSS_TX_PIN=14
    -DUBLOX_GNSS_TARGET_BAUD_RATE=115200
    -DUBLOX_GNSS_FALLBACK_BAUD_RATE=38400
    -DGNSS_RX_BUFFER_SIZE=4096
    -DGNSS_TIME_SYNC_INTERVAL_MS=120000
    -DNIKON_BLE_UPDATE_INTERVAL_MS=30000
    -DNIKON_BT_SEARCH_TIME_MS=60000
    -DNIKON_BT_PAIR_TIMEOUT_MS=120000
    -DNIKON_BT_AFTER_PAIR_TIME_MS=6000
build_unflags =
custom_sdkconfig =
    ; Disable unused BT profiles to free IRAM0 (cache workaround eats ~10KB).
    ; Project uses only: BLE GATT client + SPP classic BT + SMP bonding.
    ; GATTS cannot be disabled: Arduino BLE library unconditionally references
    ; esp_ble_gatts_set_attr_value (BLEDescriptor.cpp).
    CONFIG_BT_A2DP_ENABLE=n
    CONFIG_BT_HFP_ENABLE=n
    CONFIG_BT_BLE_BLUFI_ENABLE=n
    ; Disable WiFi — project is Bluetooth-only, no WiFi references anywhere.
    CONFIG_ESP_WIFI_ENABLED=n
    ; Place non-ISR FreeRTOS / ringbuf / heap functions into flash (per ESP-IDF
    ; IRAM-optimization guide). All three are documented as safe to enable in
    ; all configurations, provided their functions aren't called from IRAM
    ; ISRs (they aren't in this project). Frees ~3KB+ of IRAM.
    CONFIG_FREERTOS_PLACE_FUNCTIONS_INTO_FLASH=y
    CONFIG_RINGBUF_PLACE_FUNCTIONS_INTO_FLASH=y
    CONFIG_HEAP_PLACE_FUNCTION_INTO_FLASH=y
build_src_filter =
    +<*> -<.git/> -<.svn/>
    ; by default do not include any boards file
    -<boards/>
custom_component_remove = 
    espressif/esp-modbus

; for testing the libs
; $ pio test -e native
[env:native]
platform = native
test_build_src = no
build_flags =
    -std=gnu++17
    -DUNITY_SUPPORT_64

; ============================== M5Stack Core2 ==============================

[m5stack-core2-base]
extends = esp32-base
board = m5stack-core2
upload_speed = 921600
board_build.partitions = partitions/esp32/default_16MB.csv
build_flags =
    ${esp32-base.build_flags}
    -DBOARD_HAS_PSRAM
    -DUNITY_SUPPORT_64
    -DSCREEN_TIMEOUT_MS=30000
build_unflags=
    ${esp32-base.build_unflags}
    ; enable the use of hardware atomics, but risk of corrupting PSRAM data silenty
    ; hardware atomic operate on PSRAM addess will silenty corrupt the data
    ; see https://github.com/espressif/esp-idf/issues/4635
    ;   and https://github.com/esp-rs/esp-hal/issues/2027
    ; see CONFIG_SPIRAM_USE_MALLOC below
    -mdisable-hardware-atomics
custom_sdkconfig =
    ${esp32-base.custom_sdkconfig}
    CONFIG_ESP32_REV_MIN=3
    ; Shrink SPIRAM cache-workaround IRAM footprint. The core libc functions
    ; (memset/memcpy/memcmp/strlen/strcmp/strcat/itoa) stay in IRAM always;
    ; only the optional groups below are disabled. These functions are not
    ; called inside cache-disabled windows (flash erase/write, NVS, BT crypto).
    CONFIG_SPIRAM_CACHE_LIBJMP_IN_IRAM=n
    CONFIG_SPIRAM_CACHE_LIBMATH_IN_IRAM=n
    CONFIG_SPIRAM_CACHE_LIBNUMPARSER_IN_IRAM=n
    CONFIG_SPIRAM_CACHE_LIBIO_IN_IRAM=n
    CONFIG_SPIRAM_CACHE_LIBTIME_IN_IRAM=n
    CONFIG_SPIRAM_CACHE_LIBCHAR_IN_IRAM=n
    CONFIG_SPIRAM_CACHE_LIBMEM_IN_IRAM=n
    CONFIG_SPIRAM_CACHE_LIBSTR_IN_IRAM=n
    CONFIG_SPIRAM_CACHE_LIBRAND_IN_IRAM=n
    CONFIG_SPIRAM_CACHE_LIBENV_IN_IRAM=n
    CONFIG_SPIRAM_CACHE_LIBFILE_IN_IRAM=n
    CONFIG_SPIRAM_CACHE_LIBMISC_IN_IRAM=n
    ; DO NOT use PSRAM for malloc
    CONFIG_SPIRAM_USE_MALLOC=n
    ; PSRAM can be used by explicit calls like heap_caps_malloc or ps_malloc
    CONFIG_SPIRAM_USE_CAPS_ALLOC=y
lib_deps =
    ${esp32-base.lib_deps}
    m5stack/M5Unified @ 0.2.17
build_src_filter = 
    ${esp32-base.build_src_filter}
    +<boards/m5stack-core2>

[env:m5stack-core2-debug]
extends = m5stack-core2-base
build_type = debug
build_flags =
    ${m5stack-core2-base.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DNSG_LOG_LEVEL=0

[env:m5stack-core2-release]
extends = m5stack-core2-base
build_type = release
build_flags =
    ${m5stack-core2-base.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -DNSG_LOG_LEVEL=1

; ============================== ESP32 WROOM 32E ==============================

[esp32-wroom-32e-base]
extends = esp32-base
board = esp32dev
upload_speed = 921600
board_build.partitions = partitions/esp32/default_4MB.csv
build_flags =
    ${esp32-base.build_flags}
    -DUNITY_SUPPORT_64
    ; short to GND to enter pairing mode
    -DBOOTMODE_DETECT_PIN=19
    -DBOOTMODE_DETECT_DELAY_MS=2000
custom_sdkconfig =
    ${esp32-base.custom_sdkconfig}
    CONFIG_ESP32_REV_MIN=3
    ; use Internal 8.5MHz oscillator divided by 256
    ; higher deep sleep current, but better accuracy
    CONFIG_RTC_CLK_SRC_INT_RC=n
    CONFIG_RTC_CLK_SRC_INT_8MD256=y
build_src_filter = 
    ${esp32-base.build_src_filter}
    +<boards/esp32-wroom-32e>

[env:esp32-wroom-32e-debug]
extends = esp32-wroom-32e-base
build_type = debug
build_flags =
    ${esp32-wroom-32e-base.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DNSG_LOG_LEVEL=0

[env:esp32-wroom-32e-release]
extends = esp32-wroom-32e-base
build_type = release
build_flags =
    ${esp32-wroom-32e-base.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -DNSG_LOG_LEVEL=1
